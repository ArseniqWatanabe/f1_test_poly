<div class="custom-select" [class.open]="isOpen()">
    <button class="select-trigger" (click)="toggle()" type="button">
        <span class="selected-label">{{ getSelectedLabel() }}</span>
        <span class="select-arrow"></span>
    </button>

    @if (isOpen()) {
    <div class="select-dropdown">
        @for (option of options(); track option.id) {
        <button class="select-option" [class.active]="selectedId() === option.id" (click)="select(option)"
            type="button">
            @if (option.preview) {
            <span class="option-preview" [style.background]="option.preview"></span>
            }
            <span class="option-label">{{ option.label }}</span>
        </button>
        }
    </div>
    }
</div>
