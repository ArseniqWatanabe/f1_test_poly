<!doctype html>
<html lang="en">

<head>
  <script>
    (function () {
      try {
        const match = document.cookie.match(/app-theme=([^;]+)/);
        const saved = match ? match[1] : 'gradient';
        const valid = ['gradient', 'dark', 'light'];
        const theme = valid.includes(saved) ? saved : 'gradient';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'gradient');
      }
    })();
  </script>
  <meta charset="utf-8">
  <title>M8 Research Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="M8 Research Platform: A proprietary, reusable core engine for high-tech biomedicine. Powering AI diagnostics, medical robotics, and advanced health analytics.">
  <meta name="theme-color" content="#1a1a2e">

  <meta property="og:title" content="M8 Research Platform">
  <meta property="og:description"
    content="M8 Research Platform: A proprietary, reusable core engine for high-tech biomedicine. Powering AI diagnostics, medical robotics, and advanced health analytics.">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
  <link rel="manifest" href="manifest.webmanifest">

  <base href="/">
</head>

<body>
  <app-root></app-root>
</body>

</html>
